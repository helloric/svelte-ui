site_name: HelloRIC Documentation
site_url: http://127.0.0.1:8000/
nav:
  - Overview:
    - Framework: svelte.md
    - Purpose: getting-Started.md
  - The Code itself:
    - The assets: assets.md
    - The botface component: botface.md
    - The CSS behind: style.md
    - The animaion: animation.md
    - The router: router.md
    - The final Display: routes_folder.md
  #- Messages:
   # - Overview: messages/overview.md
  #- Informations:
   # - Exhibits: informations/exhibits.md

theme:
  name: material
  palette:
   - scheme: default
     toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

   - scheme: slate
     toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
        
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition

plugins:
- search
- mkdocstrings:
    handlers:
      python:
        paths: [src]